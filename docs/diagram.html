<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}</style>
<title>Unicorn Desk Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
/* Layout: two sketches on paper, the flowchart and the hardware, side by side when wide, stacked on a phone. Single paper look on purpose. */
:root {
  --paper: #fbf8f1;
  --ink: #2b2a33;
  --pencil: #6b6878;
  --hand: "Caveat", "Comic Sans MS", "Segoe Print", cursive;
  color-scheme: light;
}
body { background: var(--paper); color: var(--ink); padding-inline: 16px; padding-block: 24px; }
.sheet { max-width: 880px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 24px; }
.sheet > svg { flex: 1 1 340px; max-width: 420px; min-width: 0; }
svg { display: block; width: 100%; height: auto; }
svg text { font-family: var(--hand); fill: var(--ink); }
</style>

<div class="sheet">
  <svg id="c" viewBox="0 0 400 860" role="img" aria-label="Flowchart: I type a word on my iPad, the web app on the Raspberry Pi asks Claude, Claude replies with a 16 by 16 grid of letters, and the Pi lights up 256 LEDs as pixel art."></svg>
  <svg id="hw" viewBox="0 0 400 620" role="img" aria-label="Sketch of the hardware: the Unicorn HAT HD, a board with 16 by 16 LEDs, plugs onto the 40 pins of a Raspberry Pi 4, a credit-card-sized computer that talks to the iPad and Claude over Wi-Fi."></svg>
</div>

<script>
(function () {
  var INK = "#2b2a33", PENCIL = "#6b6878";
  var svg = document.getElementById("c");
  var NS = "http://www.w3.org/2000/svg";
  var seed = 7;

  // rough.js gives the wobbly hand-drawn lines; plain SVG if it fails to load.
  var rc = window.rough ? rough.svg(svg) : null;
  function el(name, attrs) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function opts(o) {
    var base = { seed: seed++, roughness: 1.4, bowing: 1.2, stroke: INK, strokeWidth: 1.7,
                 fillStyle: "hachure", hachureGap: 7, fillWeight: 1.1, hachureAngle: -40 };
    for (var k in o) base[k] = o[k];
    return base;
  }
  function rect(x, y, w, h, o) {
    svg.appendChild(rc ? rc.rectangle(x, y, w, h, opts(o)) :
      el("rect", { x: x, y: y, width: w, height: h, rx: 6, fill: (o && o.fill) || "none", stroke: INK, "stroke-width": 1.7 }));
  }
  function ellipse(cx, cy, w, h, o) {
    svg.appendChild(rc ? rc.ellipse(cx, cy, w, h, opts(o)) :
      el("ellipse", { cx: cx, cy: cy, rx: w / 2, ry: h / 2, fill: (o && o.fill) || "none", stroke: INK, "stroke-width": 1.7 }));
  }
  function line(x1, y1, x2, y2, o) {
    svg.appendChild(rc ? rc.line(x1, y1, x2, y2, opts(o)) :
      el("line", { x1: x1, y1: y1, x2: x2, y2: y2, stroke: INK, "stroke-width": 1.7 }));
  }
  function arrow(x, y1, y2) {
    line(x, y1, x, y2, { roughness: 1.1 });
    line(x, y2, x - 8, y2 - 11, { roughness: 0.8 });
    line(x, y2, x + 8, y2 - 11, { roughness: 0.8 });
  }
  function text(x, y, str, size, o) {
    o = o || {};
    var t = el("text", { x: x, y: y, "font-size": size, "text-anchor": o.anchor || "middle",
                         "font-weight": o.weight || 500, fill: o.color || INK });
    if (o.rotate) t.setAttribute("transform", "rotate(" + o.rotate + " " + x + " " + y + ")");
    t.textContent = str;
    svg.appendChild(t);
  }

  // Title
  text(200, 42, "How my LED desk display works", 30, { weight: 700 });
  line(70, 54, 330, 52, { roughness: 2, strokeWidth: 1.3 });

  // 1. iPad
  rect(56, 84, 288, 76, { fill: "#ffe27a" });
  text(200, 116, "I type a word on my iPad", 25, { weight: 700 });
  text(200, 144, "“cat”", 24);
  arrow(200, 166, 214);

  // 2. Web app on the Pi
  rect(56, 220, 288, 76, { fill: "#a8e6ff" });
  text(200, 252, "Web app on the Raspberry Pi", 25, { weight: 700 });
  text(200, 280, "(Streamlit)", 22, { color: PENCIL });
  arrow(200, 302, 352);
  text(212, 324, "“draw a cat,", 20, { anchor: "start", color: PENCIL });
  text(212, 344, "16×16 pixels”", 20, { anchor: "start", color: PENCIL });

  // 3. Claude (cloud-ish ellipse)
  ellipse(200, 404, 250, 92, { fill: "#ffb3d1" });
  text(200, 402, "Claude (AI)", 28, { weight: 700 });
  text(200, 428, "in the cloud", 21, { color: PENCIL });
  arrow(200, 456, 506);
  text(212, 476, "replies with", 20, { anchor: "start", color: PENCIL });
  text(212, 496, "a grid of letters", 20, { anchor: "start", color: PENCIL });

  // 4. Letter grid
  rect(36, 512, 238, 92, { fill: "#c4f0b0" });
  var rows = ["kkopokkkkkopokkk", "kooggoooooggoook", "kwwoooopppoooowk"];
  rows.forEach(function (r, i) {
    var t = el("text", { x: 155, y: 540 + i * 22, "font-size": 19, "text-anchor": "middle",
                         "letter-spacing": "1.5", fill: INK, "font-family": "ui-monospace, Consolas, monospace" });
    t.textContent = r;
    svg.appendChild(t);
  });
  text(288, 548, "each letter", 19, { anchor: "start", color: PENCIL, rotate: 6 });
  text(288, 568, "= 1 pixel", 19, { anchor: "start", color: PENCIL, rotate: 6 });
  text(288, 588, "& 1 colour", 19, { anchor: "start", color: PENCIL, rotate: 6 });
  arrow(200, 610, 658);

  // 5. LEDs
  rect(70, 664, 260, 186, {});
  text(200, 694, "256 LEDs light up!", 26, { weight: 700 });
  var cell = 8.5, gx = 200 - 8 * cell, gy = 708;
  svg.appendChild(el("rect", { x: gx - 4, y: gy - 4, width: 16 * cell + 8, height: 16 * cell + 8, rx: 3, fill: "#1d1b24" }));
  var pal = { o: "#ff8c00", w: "#ffffff", g: "#00e83a", p: "#ff50a0" };
  var cat = ["kkkkkkkkkkkkkkkk","kkokkkkkkkkkokkk","kkookkkkkkkookkk","kkopokkkkkopokkk","kkooooooooooookk","kkooooooooooookk","kooggoooooggoook","koogkoooooogkook","kooooooooooooook","kwwoooopppoooowk","kooooooopooooook","kwwooowooowoooow","kkooooowwwoooook","kkkooooooooookkk","kkkkooooooookkkk","kkkkkkkkkkkkkkkk"];
  cat.forEach(function (r, y) {
    for (var x = 0; x < 16; x++) {
      svg.appendChild(el("rect", { x: gx + x * cell + 0.6, y: gy + y * cell + 0.6, width: cell - 1.2, height: cell - 1.2,
                                   rx: 1.2, fill: pal[r[x]] || "#34313f" }));
    }
  });
  text(99, 790, "16 × 16", 18, { color: PENCIL, rotate: -8 });
  text(300, 782, "the Pi’s", 17, { color: PENCIL, rotate: 7 });
  text(300, 800, "LED", 17, { color: PENCIL, rotate: 7 });
  text(300, 818, "board", 17, { color: PENCIL, rotate: 7 });

  // ---- Second sketch: the hardware ----
  svg = document.getElementById("hw");
  rc = window.rough ? rough.svg(svg) : null;

  text(200, 42, "What\u2019s on my desk", 30, { weight: 700 });
  line(110, 54, 290, 52, { roughness: 2, strokeWidth: 1.3 });

  // Unicorn HAT HD, floating above the Pi
  rect(90, 88, 220, 172, { fill: "#1d1b24", fillStyle: "solid" });
  var heart = ["kkkkkkkkkkkkkkkk","kkkkkkkkkkkkkkkk","kkkrrrkkkkrrrkkk","kkrrrrrkkrrrrrkk","krrwwrrrrrrrrrrk","krrwrrrrrrrrrrrk","krrrrrrrrrrrrrrk","krrrrrrrrrrrrrrk","kkrrrrrrrrrrrrkk","kkkrrrrrrrrrrkkk","kkkkrrrrrrrrkkkk","kkkkkrrrrrrkkkkk","kkkkkkrrrrkkkkkk","kkkkkkkrrkkkkkkk","kkkkkkkkkkkkkkkk","kkkkkkkkkkkkkkkk"];
  var hpal = { r: "#ff4f8b", w: "#ffffff" };
  var hc = 8.5, hx = 200 - 8 * hc, hy = 106;
  heart.forEach(function (r, y) {
    for (var x = 0; x < 16; x++) {
      svg.appendChild(el("rect", { x: hx + x * hc + 0.6, y: hy + y * hc + 0.6, width: hc - 1.2, height: hc - 1.2,
                                   rx: 1.2, fill: hpal[r[x]] || "#3a3646" }));
    }
  });
  text(356, 160, "Unicorn", 21, { weight: 700, rotate: 6 });
  text(356, 182, "HAT HD", 21, { weight: 700, rotate: 6 });
  text(45, 160, "256", 20, { color: PENCIL, rotate: -6 });
  text(45, 180, "LEDs", 20, { color: PENCIL, rotate: -6 });

  // it plugs straight down onto the pins
  line(110, 266, 110, 330, { strokeLineDash: [6, 6], roughness: 0.8, stroke: PENCIL });
  line(290, 266, 290, 330, { strokeLineDash: [6, 6], roughness: 0.8, stroke: PENCIL });
  text(200, 304, "plugs onto the 40 pins", 20, { color: PENCIL });

  // Raspberry Pi 4
  rect(60, 336, 280, 176, { fill: "#86d39a" });
  for (var i = 0; i < 20; i++) {
    for (var j = 0; j < 2; j++) {
      svg.appendChild(el("rect", { x: 104 + i * 9.6, y: 344 + j * 9, width: 6, height: 6, rx: 1, fill: "#d4a72c", stroke: INK, "stroke-width": 0.6 }));
    }
  }
  rect(150, 398, 64, 64, { fill: "#b9b7c2", hachureGap: 5 });
  text(182, 436, "CPU", 18, { color: PENCIL });
  rect(326, 372, 40, 30, { fill: "#d9d8de", fillStyle: "solid" });
  rect(326, 410, 40, 30, { fill: "#d9d8de", fillStyle: "solid" });
  rect(326, 450, 40, 44, { fill: "#d9d8de", fillStyle: "solid" });
  text(378, 392, "USB", 16, { anchor: "start", color: PENCIL, rotate: 90 });
  rect(98, 504, 28, 14, { fill: "#d9d8de", fillStyle: "solid" });
  text(112, 540, "power in", 18, { color: PENCIL });

  text(220, 552, "Raspberry Pi 4", 26, { weight: 700 });
  text(200, 580, "a credit-card-sized computer", 20, { color: PENCIL });
  text(200, 604, "talks to my iPad + Claude over Wi-Fi", 20, { color: PENCIL });
})();
</script>

</html>
